<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; overflow:hidden; background:#f0f2f5; color:white; }
#mapa { position:fixed; left:0; top:0; width:100%; height:100%; z-index:1; background:#e4e6eb; }
#status-bar { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:1000; padding:8px 20px; border-radius:50px; font-size:13px; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,0.5); transition:all .3s ease; max-width:90%; white-space:nowrap; background:#1e1e24; color:#fff; border:1px solid rgba(255,255,255,0.05); text-align:center; backdrop-filter:blur(5px); display:flex; align-items:center; justify-content:center; gap:8px; }

#info-rota { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:1000; background:rgba(24,24,30,0.95); backdrop-filter:blur(8px); padding:6px 14px; border-radius:12px; color:#f4f4f5; border:1px solid rgba(255,255,255,0.06); box-shadow:0 6px 20px rgba(0,0,0,0.6); display:none; text-align:center; max-width:92%; min-width:160px; font-size:11px; }

#controles-simulacao { position:fixed; bottom:110px; left:50%; transform:translateX(-50%); z-index:2000; display:none; flex-direction:row; flex-wrap:wrap; justify-content:center; align-items:center; gap:4px; background:rgba(13,13,18,0.85); padding:6px 12px; border-radius:30px; }
#controles-simulacao button { background:transparent; border:none; color:#f4f4f5; padding:3px 10px; border-radius:20px; cursor:pointer; font-size:11px; }
.btn-sim-iniciar { color:#22c55e !important; }
.btn-sim-pausar { color:#fbbf24 !important; }
.btn-sim-parar { color:#ef4444 !important; }
.btn-sim-demo { color:#f97316 !important; }
#btn-tema-mapa { position:fixed; top:115px; left:10px; z-index:2000; width:30px; height:30px; background:white; color:#333; border:none; cursor:pointer; display:none; }
#btn-centralizar { position:fixed; bottom:230px; right:20px; z-index:2000; width:40px; height:40px; border-radius:50%; background:#1e1e24; color:#3b82f6; border:1px solid rgba(255,255,255,0.1); cursor:pointer; display:none; align-items:center; justify-content:center; }
#btn-reportar { position:fixed; bottom:280px; right:20px; z-index:2000; width:40px; height:40px; border-radius:50%; background:#1e1e24; color:#f97316; border:1px solid rgba(255,255,255,0.1); cursor:pointer; display:none; align-items:center; justify-content:center; }
#menu-reporte { position:fixed; bottom:335px; right:20px; z-index:2000; background:#18181e; padding:10px; border-radius:14px; display:none; flex-direction:column; gap:6px; min-width:120px; }
#menu-reporte button { background:transparent; border:none; color:#f4f4f5; padding:6px 10px; border-radius:8px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:10px; }
#login-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.92); z-index:9999; display:flex; align-items:center; justify-content:center; }
#login-overlay.hidden { display:none; }
.login-card { background:#1a1a2e; padding:36px 30px; border-radius:20px; width:100%; max-width:360px; }
.login-card h2 { font-size:24px; margin-bottom:6px; text-align:center; }
.login-card h2 span { color:#3b82f6; }
.login-card p { color:#a1a1aa; margin-bottom:20px; text-align:center; }
.grupo { margin-bottom:16px; }
.grupo label { display:block; font-size:11px; color:#a1a1aa; margin-bottom:3px; font-weight:600; }
.grupo input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid #2a2a3e; background:#0f0f1a; color:white; font-size:14px; }
.btn-primary { width:100%; padding:10px; background:#3b82f6; color:white; border:none; border-radius:8px; font-size:15px; font-weight:bold; cursor:pointer; }
.status-box { margin-top:14px; padding:8px; background:#0f0f1a; border-radius:6px; font-size:12px; text-align:center; border-left:3px solid #3b82f6; color:#a1a1aa; }
#legenda-reportes-motorista { position:fixed; bottom:190px; left:20px; z-index:2000; background:rgba(13,13,18,0.9); padding:6px 10px; border-radius:8px; display:none; font-size:10px; }
.legenda-item { display:flex; align-items:center; gap:4px; }
.cor-bolinha { width:8px; height:8px; border-radius:50%; }
@media(max-width:768px){ #status-bar { top:15px; font-size:11px; padding:6px 14px; white-space:normal; } #info-rota { bottom:15px; width:94%; } #velocimetro { bottom:110px; left:10px; width:55px; height:55px; } #btn-centralizar { bottom:180px; right:10px; } #btn-reportar { bottom:220px; right:10px; } #menu-reporte { bottom:270px; right:10px; } }
</style>
</head>
<body>
<div id="mapa"></div>
<div id="status-bar"><i class="fas fa-circle-notch fa-spin"></i> Carregando...</div>
<button id="btn-iniciar-3d"><i class="fas fa-route"></i> Iniciar Navegação 3D</button>
<button id="btn-tema-mapa"><i class="fas fa-moon"></i></button>

<div id="menu-reporte">
<button onclick="enviarReporte('radar')">📡 Radar</button>

<div id="velocimetro"><span id="velocidade-valor">0</span><span id="velocidade-unidade">km/h</span></div>
<div id="controles-simulacao">
<button class="btn-sim-iniciar" onclick="iniciarSimulacao(30)">▶ 30</button>

<button class="btn-sim-iniciar" onclick="iniciarSimulacao(90)">▶ 90</button>

<button class="btn-sim-parar" onclick="pararSimulacao()">⏹ Parar</button>

</div>
<div id="legenda-reportes-motorista">
<strong>📢 Reportes</strong>
<div class="legenda-item"><div class="cor-bolinha" style="background:#ef4444"></div>Acidente</div>
<div class="legenda-item"><div class="cor-bolinha" style="background:#f97316"></div>Radar</div>
<div class="legenda-item"><div class="cor-bolinha" style="background:#fbbf24"></div>Obra</div>
<div class="legenda-item"><div class="cor-bolinha" style="background:#f59e0b"></div>Perigo</div>
<div class="legenda-item"><div class="cor-bolinha" style="background:#d63031"></div>Alto Risco</div>
</div>
<div id="info-rota"></div>
<div id="login-overlay">
<div class="login-card">
<h2>🚛 <span>GPS</span> Motorista</h2>
<p>Acesse sua rota atribuída</p>
<div class="grupo"><label>Login</label><input type="text" id="login-user" value="jose"></div>
<div class="grupo"><label>Senha</label><input type="password" id="login-pass" value="motor123"></div>
<button class="btn-primary" onclick="fazerLoginMotorista()">Entrar</button>
<div id="login-status" class="status-box">Use jose / motor123</div>
</div>
</div>
<script>
// ======================================================
// API BASE – FIXO PARA RENDER
// ======================================================
const API_BASE = 'https://sistema-gps-cpf7.onrender.com';

// ======================================================
// VARIÁVEIS
// ======================================================
let mapa = null, tokenJWT = null, marcadorMotorista = null, watchId = null;
let ultimaPosicaoLngLat = null, ultimoBearing = 0, modoNavegacaoAtivo = false;
let dadosGeoJsonAtual = null, temaAtual = 'light', intervalMonitoramento = null;
let intervalReportes = null, pathCoordinates = [];
let simulacaoAtiva = false, simulacaoPausada = false, intervalSimulacao = null;
let indexSimulacao = 0, velocidadeSimulacao = 30;
let vozFemininaSelecionada = null, marcadoresReportes = [];
let ultimaLocalizacaoEnviada = 0, envioLocalizacaoEmAndamento = false;
const INTERVALO_ENVIO_LOCALIZACAO = 5000;
let incidentesProcessados = new Set(), ultimoRecalculo = 0;
let COOLDOWN_RECALCULO = 120000, MAX_RECALCULOS = 3, totalRecalculos = 0;

const estiloLight = 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json';
const estiloDark = 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json';
const estiloFallbackLight = 'https://tiles.openfreemap.org/styles/liberty';
const estiloFallbackDark = 'https://tiles.openfreemap.org/styles/dark-matter';

// ======================================================
// VOZ E UTILIDADES
// ======================================================
function inicializarVozes() {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.onvoiceschanged = () => {
        const vozes = window.speechSynthesis.getVoices();
        vozFemininaSelecionada = vozes.find(v => v.lang.includes('pt-BR')) || vozes.find(v => v.lang.includes('pt'));
    };
    if (window.speechSynthesis.getVoices().length > 0) window.speechSynthesis.onvoiceschanged();
}
function playBeep() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.value = 800;
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.15);
    } catch(e) {}
}
function speak(text) {
    if (!window.speechSynthesis) return;
    playBeep();
    setTimeout(() => {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        utterance.rate = 1;
        if (vozFemininaSelecionada) utterance.voice = vozFemininaSelecionada;
        window.speechSynthesis.speak(utterance);
    }, 300);
}
function calcularDistancia(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}
function calcularBearing(lat1, lon1, lat2, lon2) {
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
    const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) - Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
function encontrarIndiceMaisProximo(lat, lng, inicio = 0) {
    if (!pathCoordinates || pathCoordinates.length === 0) return -1;
    let melhor = -1, menor = Infinity;
    for (let i = Math.max(0, inicio); i < pathCoordinates.length; i++) {
        const c = pathCoordinates[i];
        const d = calcularDistancia(lat, lng, c[1], c[0]);
        if (d < menor) { menor = d; melhor = i; }
    }
    return melhor;
}
function encontrarIndiceAtual() {
    if (!marcadorMotorista) return 0;
    const pos = marcadorMotorista.getLngLat();
    return Math.max(0, encontrarIndiceMaisProximo(pos.lat, pos.lng));
}
function encontrarReentrada(idxIncidente, distanciaDesejadaKm = 1.5) {
    if (idxIncidente < 0 || idxIncidente >= pathCoordinates.length) return -1;
    let acumulada = 0;
    for (let i = idxIncidente + 1; i < pathCoordinates.length; i++) {
        const ant = pathCoordinates[i-1], atu = pathCoordinates[i];
        acumulada += calcularDistancia(ant[1], ant[0], atu[1], atu[0]);
        if (acumulada >= distanciaDesejadaKm) return i;
    }
    return pathCoordinates.length - 1;
}
async function enviarLocalizacaoServidor(lat, lon) {
    if (!tokenJWT) return;
    const agora = Date.now();
    if (agora - ultimaLocalizacaoEnviada < INTERVALO_ENVIO_LOCALIZACAO || envioLocalizacaoEmAndamento) return;
    envioLocalizacaoEmAndamento = true;
    try {
        const resp = await fetch(`${API_BASE}/localizacao`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': tokenJWT },
            body: JSON.stringify({ lat: Number(lat), lon: Number(lon) })
        });
        if (resp.ok) ultimaLocalizacaoEnviada = agora;
    } catch(e) { console.warn(e); }
    finally { envioLocalizacaoEmAndamento = false; }
}

// ======================================================
// MAPA E LOGIN
// ======================================================
function initMapa() {
    if (mapa) return;
    mapa = new maplibregl.Map({
        container: 'mapa',
        style: estiloLight,
        center: [-46.6333, -23.5505],
        zoom: 14,
        pitch: 0,
        bearing: 0
    });
    mapa.addControl(new maplibregl.NavigationControl());
    document.getElementById('btn-iniciar-3d').addEventListener('click', iniciarNavegacao3D);
    document.getElementById('btn-tema-mapa').addEventListener('click', alternarTemaMapa);
    document.getElementById('btn-centralizar').addEventListener('click', centralizarNoCarro);
    document.getElementById('btn-reportar').addEventListener('click', toggleMenuReporte);
    mapa.on('style.load', () => { if (dadosGeoJsonAtual) desenharRota(dadosGeoJsonAtual, false); });
}
async function fazerLoginMotorista() {
    const login = document.getElementById('login-user').value;
    const senha = document.getElementById('login-pass').value;
    const status = document.getElementById('login-status');
    status.innerHTML = '🔄 Autenticando...';
    try {
        const resp = await fetch(`${API_BASE}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ login, senha })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.erro || 'Erro no login');
        if (data.usuario.tipo !== 'motorista') throw new Error('Acesso negado');
        tokenJWT = data.token;
        document.getElementById('login-overlay').classList.add('hidden');
        initMapa();
        await carregarRotaDoMotorista();
        if (intervalReportes) clearInterval(intervalReportes);
        intervalReportes = setInterval(() => { if (tokenJWT && mapa) carregarReportesMotorista(); }, 30000);
    } catch(erro) {
        status.innerHTML = '❌ ' + erro.message;
    }
}
async function carregarRotaDoMotorista() {
    const statusBar = document.getElementById('status-bar');
    try {
        statusBar.innerHTML = '🔄 Buscando rota...';
        statusBar.className = 'carregando';
        const resp = await fetch(`${API_BASE}/rotas/minha-rota`, { headers: { 'Authorization': tokenJWT } });
        if (resp.status === 404) { await carregarRotaTeste(); return; }
        if (!resp.ok) throw new Error('Erro ao buscar rota');
        const dados = await resp.json();
        dadosGeoJsonAtual = dados.dados_geojson;
        const executar = () => {
            desenharRota(dadosGeoJsonAtual);
            mostrarInformacoesRota(dadosGeoJsonAtual, dados);
            ativarInterface();
            statusBar.innerHTML = `✅ Rota "${dados.nome || 'Sem nome'}" carregada!`;
            statusBar.className = 'sucesso';
            setTimeout(carregarReportesMotorista, 3000);
        };
        if (mapa.loaded()) executar(); else mapa.once('load', executar);
    } catch(erro) { console.error(erro); await carregarRotaTeste(); }
}
async function carregarRotaTeste() {
    const resp = await fetch(`${API_BASE}/teste-rota`);
    const dados = await resp.json();
    dadosGeoJsonAtual = dados;
    const executar = () => {
        desenharRota(dadosGeoJsonAtual);
        mostrarInformacoesRota(dadosGeoJsonAtual, dados);
        ativarInterface();
    };
    if (mapa.loaded()) executar(); else mapa.once('load', executar);
}
function ativarInterface() {
    document.getElementById('btn-iniciar-3d').style.display = 'flex';
    document.getElementById('btn-tema-mapa').style.display = 'flex';
    document.getElementById('btn-centralizar').style.display = 'flex';
    document.getElementById('btn-reportar').style.display = 'flex';
    document.getElementById('controles-simulacao').style.display = 'flex';
    document.getElementById('legenda-reportes-motorista').style.display = 'block';
}
function desenharRota(geoJson, reposicionarMotorista = true) {
    if (!geoJson || !mapa) return;
    if (mapa.getLayer('rota-layer')) mapa.removeLayer('rota-layer');
    if (mapa.getLayer('rota-layer-glow')) mapa.removeLayer('rota-layer-glow');
    if (mapa.getSource('rota-src')) mapa.removeSource('rota-src');
    const coords = geoJson.features?.[0]?.geometry?.coordinates;
    if (!coords || coords.length === 0) return;
    pathCoordinates = coords;
    mapa.addSource('rota-src', { type: 'geojson', data: geoJson });
    mapa.addLayer({ id: 'rota-layer-glow', type: 'line', source: 'rota-src', paint: { 'line-color': '#3b82f6', 'line-width': 22, 'line-opacity': 0.2, 'line-blur': 15 } });
    mapa.addLayer({ id: 'rota-layer', type: 'line', source: 'rota-src', paint: { 'line-color': '#3b82f6', 'line-width': 14, 'line-opacity': 0.9 } });
    if (!marcadorMotorista) {
        const el = document.createElement('div');
        el.innerHTML = `<div style="background:#3b82f6;color:white;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;border:4px solid white;box-shadow:0 6px 16px rgba(0,0,0,.4);"><i class="fas fa-location-arrow"></i></div>`;
        marcadorMotorista = new maplibregl.Marker({ element: el }).setLngLat(coords[0]).addTo(mapa);
        ultimaPosicaoLngLat = coords[0];
    } else if (reposicionarMotorista) {
        marcadorMotorista.setLngLat(coords[0]);
        ultimaPosicaoLngLat = coords[0];
    }
    if (reposicionarMotorista) {
        const bounds = new maplibregl.LngLatBounds();
        coords.forEach(c => bounds.extend(c));
        mapa.fitBounds(bounds, { padding: 60, maxZoom: 14 });
    }
}
function mostrarInformacoesRota(geoJson, dadosRota) {
    const div = document.getElementById('info-rota');
    const segmento = geoJson.features?.[0]?.properties?.segments?.[0];
    if (!segmento) { div.style.display = 'none'; return; }
    const dist = (segmento.distance / 1000).toFixed(1);
    const dur = segmento.duration;
    const h = Math.floor(dur / 3600);
    const m = Math.floor((dur % 3600) / 60);
    div.innerHTML = `<div class="route-header"><span class="orig-dest">${dadosRota.origem || 'Origem'}</span> → <span class="orig-dest">${dadosRota.destino || 'Destino'}</span></div>
        <div class="info-grid"><div class="info-item">🛣️ <span class="val">${dist}</span> km</div><div class="info-item">⏱️ <span class="val">${h}h ${m}min</span></div></div>
        <div id="progresso-viagem"><div class="barra"></div></div>`;
    div.style.display = 'block';
}
function alternarTemaMapa() {
    temaAtual = temaAtual === 'light' ? 'dark' : 'light';
    mapa.setStyle(temaAtual === 'light' ? estiloLight : estiloDark);
}
function centralizarNoCarro() {
    if (!marcadorMotorista) return;
    const pos = marcadorMotorista.getLngLat();
    mapa.jumpTo({ center: pos, zoom: modoNavegacaoAtivo ? 19 : 15, pitch: modoNavegacaoAtivo ? 65 : 0, bearing: modoNavegacaoAtivo ? ultimoBearing : 0 });
}
function iniciarNavegacao3D() {
    if (!marcadorMotorista) return;
    modoNavegacaoAtivo = true;
    document.getElementById('btn-iniciar-3d').style.display = 'none';
    document.getElementById('velocimetro').style.display = 'flex';
    const pos = marcadorMotorista.getLngLat();
    mapa.flyTo({ center: pos, zoom: 19, pitch: 65, bearing: 0, duration: 1500 });
    iniciarGPSReal();
    iniciarMonitoramentoRota();
}
function iniciarGPSReal() {
    if (gpsInicializado) return;
    if (!navigator.geolocation) { alert('Seu navegador não suporta GPS.'); return; }
    gpsInicializado = true;
    watchId = navigator.geolocation.watchPosition(
        (position) => {
            const lat = position.coords.latitude, lng = position.coords.longitude;
            const novaPosicao = [lng, lat];
            enviarLocalizacaoServidor(lat, lng);
            if (position.coords.speed !== null && Number.isFinite(position.coords.speed)) {
                document.getElementById('velocidade-valor').textContent = Math.round(position.coords.speed * 3.6);
            }
            if (ultimaPosicaoLngLat) {
                const distMetros = calcularDistancia(ultimaPosicaoLngLat[1], ultimaPosicaoLngLat[0], lat, lng) * 1000;
                if (distMetros < 3) return;
            }
            if (ultimaPosicaoLngLat) {
                ultimoBearing = calcularBearing(ultimaPosicaoLngLat[1], ultimaPosicaoLngLat[0], lat, lng);
            }
            marcadorMotorista.setLngLat(novaPosicao);
            if (marcadorMotorista._element) {
                const interno = marcadorMotorista._element.querySelector('div');
                if (interno) interno.style.transform = `rotate(${ultimoBearing}deg)`;
            }
            if (modoNavegacaoAtivo && mapa.loaded()) {
                mapa.easeTo({ center: novaPosicao, bearing: ultimoBearing, pitch: 65, zoom: 19, duration: 300 });
            }
            ultimaPosicaoLngLat = novaPosicao;
        },
        (error) => { console.warn('Erro GPS:', error); },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
    );
}
function toggleMenuReporte() {
    const menu = document.getElementById('menu-reporte');
    menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
}
async function enviarReporte(tipo) {
    if (!marcadorMotorista) return;
    const pos = marcadorMotorista.getLngLat();
    document.getElementById('menu-reporte').style.display = 'none';
    try {
        const resp = await fetch(`${API_BASE}/reportar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': tokenJWT },
            body: JSON.stringify({ lat: pos.lat, lng: pos.lng, tipo })
        });
        if (!resp.ok) throw new Error('Erro ao enviar reporte');
        speak(`Reporte de ${tipo} enviado`);
        await carregarReportesMotorista();
    } catch(erro) { console.error(erro); }
}

// ======================================================
// REPORTES COLABORATIVOS
// ======================================================
async function carregarReportesMotorista() {
    if (!tokenJWT || !mapa) return;
    try {
        const resp = await fetch(`${API_BASE}/reportes`, { headers: { 'Authorization': tokenJWT } });
        if (!resp.ok) return;
        const reportes = await resp.json();
        marcadoresReportes.forEach(m => m.remove());
        marcadoresReportes = [];
        const cores = { radar:'#f97316', acidente:'#ef4444', obra:'#fbbf24', perigo:'#f59e0b', risco:'#d63031' };
        const icones = { radar:'📡', acidente:'🚗', obra:'🚧', perigo:'⚠️', risco:'🔴' };
        const idxAtual = encontrarIndiceAtual();
        let melhorReporte = null, melhorIndice = -1, melhorDistanciaRota = Infinity;
        for (const r of reportes) {
            const el = document.createElement('div');
            el.innerHTML = `<div style="background:${cores[r.tipo] || '#fff'};color:white;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid white;">${icones[r.tipo] || '!'}</div>`;
            const marker = new maplibregl.Marker({ element: el }).setLngLat([r.lng, r.lat]).addTo(mapa);
            marcadoresReportes.push(marker);
            if (!['acidente','perigo','risco'].includes(r.tipo)) continue;
            const idxReporte = encontrarIndiceMaisProximo(Number(r.lat), Number(r.lng), idxAtual);
            if (idxReporte < 0) continue;
            const coordRota = pathCoordinates[idxReporte];
            const distanciaRota = calcularDistancia(Number(r.lat), Number(r.lng), coordRota[1], coordRota[0]);
            if (distanciaRota < 1 && idxReporte >= idxAtual && distanciaRota < melhorDistanciaRota) {
                melhorReporte = r;
                melhorIndice = idxReporte;
                melhorDistanciaRota = distanciaRota;
            }
        }
        if (melhorReporte && modoNavegacaoAtivo) {
            console.log(`🚨 Reporte ${melhorReporte.tipo} detectado à frente.`);
            await recalcularDesvioLocal(
                { lat: marcadorMotorista.getLngLat().lat, lng: marcadorMotorista.getLngLat().lng },
                { id: melhorReporte.id, tipo: melhorReporte.tipo, lat: Number(melhorReporte.lat), lng: Number(melhorReporte.lng) }
            );
        }
    } catch(erro) { console.warn('Erro ao carregar reportes:', erro); }
}
async function verificarReportesCriticosSimulacao() {
    if (!tokenJWT || !simulacaoAtiva || pathCoordinates.length === 0) return;
    try {
        const resp = await fetch(`${API_BASE}/reportes`, { headers: { 'Authorization': tokenJWT } });
        if (!resp.ok) return;
        const reportes = await resp.json();
        const idxAtual = Math.max(0, indexSimulacao);
        let melhor = null, melhorDist = Infinity;
        for (const r of reportes) {
            if (!['acidente','perigo','risco'].includes(r.tipo)) continue;
            const idxReporte = encontrarIndiceMaisProximo(Number(r.lat), Number(r.lng), idxAtual);
            if (idxReporte < idxAtual) continue;
            const c = pathCoordinates[idxReporte];
            const distRota = calcularDistancia(Number(r.lat), Number(r.lng), c[1], c[0]);
            const pos = marcadorMotorista.getLngLat();
            const distMotorista = calcularDistancia(pos.lat, pos.lng, Number(r.lat), Number(r.lng));
            if (distRota < 1 && distMotorista < 1 && distMotorista < melhorDist) {
                melhor = r;
                melhorDist = distMotorista;
            }
        }
        if (melhor) {
            const pos = marcadorMotorista.getLngLat();
            await recalcularDesvioLocal(
                { lat: pos.lat, lng: pos.lng },
                { id: melhor.id, tipo: melhor.tipo, lat: Number(melhor.lat), lng: Number(melhor.lng) }
            );
        }
    } catch(erro) { console.warn(erro); }
}

// ======================================================
// RECALCULAR DESVIO
// ======================================================
async function recalcularDesvioLocal(posicaoAtual, incidente) {
    const statusBar = document.getElementById('status-bar');
    const agora = Date.now();
    if (agora - ultimoRecalculo < COOLDOWN_RECALCULO || totalRecalculos >= MAX_RECALCULOS) return;
    let latIncidente = Number(incidente.lat), lngIncidente = Number(incidente.lng);
    if ((!Number.isFinite(latIncidente) || !Number.isFinite(lngIncidente)) && incidente.geometry) {
        if (incidente.geometry.type === 'Point') {
            lngIncidente = Number(incidente.geometry.coordinates[0]);
            latIncidente = Number(incidente.geometry.coordinates[1]);
        }
    }
    if (!Number.isFinite(latIncidente) || !Number.isFinite(lngIncidente)) { console.warn('⚠️ Incidente sem coordenada.'); return; }
    const incidenteKey = incidente.id ? `reporte-${incidente.id}` : `${latIncidente.toFixed(5)}-${lngIncidente.toFixed(5)}`;
    if (incidentesProcessados.has(incidenteKey)) return;
    const idxSaida = encontrarIndiceMaisProximo(posicaoAtual.lat, posicaoAtual.lng);
    const idxIncidente = encontrarIndiceMaisProximo(latIncidente, lngIncidente, Math.max(0, idxSaida));
    if (idxSaida < 0 || idxIncidente < 0 || idxIncidente < idxSaida) return;
    const idxReentrada = encontrarReentrada(idxIncidente, 1.5);
    if (idxReentrada <= idxIncidente) return;
    const pontoSaida = pathCoordinates[idxSaida];
    const pontoReentrada = pathCoordinates[idxReentrada];
    const pontoIncidente = [lngIncidente, latIncidente];
    console.log(`🔄 Recalculando desvio: saída=${idxSaida}, incidente=${idxIncidente}, reentrada=${idxReentrada}`);
    statusBar.innerHTML = '🔄 Calculando rota alternativa...';
    statusBar.className = 'carregando';
    try {
        const resp = await fetch(`${API_BASE}/api/recalcular-desvio`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': tokenJWT },
            body: JSON.stringify({ pontoSaida, pontoIncidente, pontoReentrada, raioBloqueio: 180, perfil: 'driving-hgv', altura: 4.2, peso: 15, comprimento: 12 })
        });
        const resposta = await resp.json();
        if (!resp.ok) throw new Error(resposta.erro || 'Falha ao recalcular');
        const coordsDesvio = resposta.features?.[0]?.geometry?.coordinates;
        if (!coordsDesvio || coordsDesvio.length < 2) throw new Error('Rota alternativa inválida');
        const rotaAntes = pathCoordinates.slice(0, idxSaida);
        const rotaDepois = pathCoordinates.slice(idxReentrada + 1);
        const novaRota = [...rotaAntes, ...coordsDesvio, ...rotaDepois];
        const novoGeoJson = { type: 'FeatureCollection', features: [{ type: 'Feature', geometry: { type: 'LineString', coordinates: novaRota }, properties: resposta.features?.[0]?.properties || {} }] };
        if (mapa.getSource('rota-src')) {
            mapa.getSource('rota-src').setData(novoGeoJson);
        } else {
            desenharRota(novoGeoJson, false);
        }
        pathCoordinates = novaRota;
        dadosGeoJsonAtual = novoGeoJson;
        if (simulacaoAtiva) {
            const pos = marcadorMotorista.getLngLat();
            indexSimulacao = Math.max(0, encontrarIndiceMaisProximo(pos.lat, pos.lng));
        }
        incidentesProcessados.add(incidenteKey);
        ultimoRecalculo = agora;
        totalRecalculos++;
        console.log(`✅ Desvio aplicado! ${totalRecalculos}/${MAX_RECALCULOS}`);
        statusBar.innerHTML = `✅ Nova rota aplicada! ${totalRecalculos}/${MAX_RECALCULOS}`;
        statusBar.className = 'sucesso';
        speak('Desviando do incidente à frente');
        setTimeout(() => {
            statusBar.innerHTML = '🚛 Navegação ativa';
            statusBar.className = 'sucesso';
        }, 2500);
    } catch(erro) {
        console.error('❌ Erro no desvio:', erro);
        statusBar.innerHTML = `❌ Erro no desvio: ${erro.message}`;
        statusBar.className = 'erro';
    }
}
function iniciarMonitoramentoRota() {
    if (intervalMonitoramento) clearInterval(intervalMonitoramento);
    intervalMonitoramento = setInterval(verificarIncidentesNaRota, 60000);
}
async function verificarIncidentesNaRota() {
    if (!marcadorMotorista || pathCoordinates.length === 0) return;
    const pos = marcadorMotorista.getLngLat();
    const raio = 0.1;
    try {
        const url = `${API_BASE}/api/traffic?top=${pos.lat+raio}&bottom=${pos.lat-raio}&left=${pos.lng-raio}&right=${pos.lng+raio}`;
        const resp = await fetch(url, { headers: { 'Authorization': tokenJWT } });
        if (!resp.ok) return;
        const dados = await resp.json();
        const incidentes = dados.incidents || [];
        let melhor = null, menorDist = Infinity;
        for (const inc of incidentes) {
            if (inc.geometry?.type === 'Point') {
                const lng = Number(inc.geometry.coordinates[0]);
                const lat = Number(inc.geometry.coordinates[1]);
                const dist = calcularDistancia(pos.lat, pos.lng, lat, lng);
                if (dist < 5 && dist < menorDist) { menorDist = dist; melhor = { ...inc, lat, lng }; }
            }
        }
        if (melhor) await recalcularDesvioLocal({ lat: pos.lat, lng: pos.lng }, melhor);
    } catch(erro) { console.warn('Erro TomTom:', erro); }
}

// ======================================================
// SIMULAÇÃO
// ======================================================
function iniciarSimulacao(velocidade, intervaloMs = 2000) {
    if (!pathCoordinates || pathCoordinates.length < 2) return;
    if (simulacaoAtiva) pararSimulacao();
    if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; gpsInicializado = false; }
    simulacaoAtiva = true;
    simulacaoPausada = false;
    velocidadeSimulacao = velocidade;
    indexSimulacao = 0;
    const inicio = pathCoordinates[0];
    marcadorMotorista.setLngLat(inicio);
    ultimaPosicaoLngLat = inicio;
    document.getElementById('velocimetro').style.display = 'flex';
    let ultimaVerificacao = 0;
    intervalSimulacao = setInterval(() => {
        if (simulacaoPausada) return;
        if (Date.now() - ultimaVerificacao > 5000) {
            ultimaVerificacao = Date.now();
            verificarReportesCriticosSimulacao();
        }
        const totalPontos = pathCoordinates.length;
        if (indexSimulacao >= totalPontos - 1) {
            pararSimulacao();
            speak('Destino alcançado');
            return;
        }
        const passos = Math.max(1, Math.floor((velocidade / 3.6) * (intervaloMs / 1000) * 0.3));
        indexSimulacao = Math.min(indexSimulacao + passos, totalPontos - 1);
        const ponto = pathCoordinates[indexSimulacao];
        if (!ponto) return;
        const lng = ponto[0], lat = ponto[1];
        const anterior = pathCoordinates[Math.max(0, indexSimulacao - passos)];
        if (anterior) ultimoBearing = calcularBearing(anterior[1], anterior[0], lat, lng);
        marcadorMotorista.setLngLat([lng, lat]);
        ultimaPosicaoLngLat = [lng, lat];
        document.getElementById('velocidade-valor').textContent = Math.round(velocidadeSimulacao);
        enviarLocalizacaoServidor(lat, lng);
        const barra = document.querySelector('#progresso-viagem .barra');
        if (barra) barra.style.width = (indexSimulacao / Math.max(1, totalPontos - 1) * 100) + '%';
        if (modoNavegacaoAtivo) {
            mapa.easeTo({ center: [lng, lat], bearing: ultimoBearing, pitch: 65, zoom: 19, duration: 500 });
        }
    }, intervaloMs);
}
function pausarSimulacao() {
    if (!simulacaoAtiva) return;
    simulacaoPausada = !simulacaoPausada;
}
function pararSimulacao() {
    if (intervalSimulacao) { clearInterval(intervalSimulacao); intervalSimulacao = null; }
    simulacaoAtiva = false;
    simulacaoPausada = false;
    document.getElementById('velocidade-valor').textContent = '0';
    document.getElementById('velocimetro').style.display = 'none';
}
function iniciarDemonstracao() {
    iniciarSimulacao(10, 2000);
}
let gpsInicializado = false;

// ======================================================
// EVENTOS
// ======================================================
document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !document.getElementById('login-overlay').classList.contains('hidden')) {
        fazerLoginMotorista();
    }
    if (e.key === 's' || e.key === 'S') {
        if (!simulacaoAtiva) iniciarSimulacao(30);
        else pausarSimulacao();
    }
    if (e.key === 'p' || e.key === 'P') {
        pararSimulacao();
    }
});
window.onload = function() { inicializarVozes(); };
</script>
